<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>چت صوتی با AI</title>

    <link rel="stylesheet" href="../static/css/styles.css">
    <style>
        .mic-area {
    display: flex;
    flex-direction: column;
    align-items: center;
    margin: 30px 0;
    position: relative;
}

.status-animation {
    width: 400px;
    height: 200px;
    position: relative;
    margin-bottom: 20px;
    overflow: hidden;
}

.viz-item {
    position: absolute;
    width: 35px;
    height: 35px;
    background: #000;
    border-radius: 50%;
    left: calc(90px + var(--i, 0) * 50px);
    top: 90px;
    transform: scale(1) translateY(0);
    transition: left 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94),
                top 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94),
                transform 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94);
}

.status-text {
    text-align: center;
    color: #4a5568;
    font-size: 16px;
    font-weight: 500;
    min-height: 24px;
    transition: opacity 0.3s ease, transform 0.3s ease;
}

.status-text.fade {
    opacity: 0;
    transform: translateY(-10px);
}

/* Idle: Static horizontal circles */
.mic-area.state-idle .viz-item {
    transform: scale(1) translateY(0);
}

/* Recording: Merge to center and pulse via parent scale */
.mic-area.state-recording .viz-item {
    left: 190px;
    top: 90px;
    width: 55px;
    height: 55px;
    transform: scale(1) translateY(0);
    transition: left 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94),
                top 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94),
                transform 0.3s ease-out;
}

.mic-area.state-recording .status-animation {
    transform: scale(var(--vol, 1));
    transform-origin: center;
    transition: transform 0.08s linear;
}

/* Processing: Disperse then sequential jump loading */
.mic-area.state-processing .viz-item {
    animation: loadingJump 0.8s ease-in-out infinite;
    animation-delay: calc(var(--i, 0) * 0.15s);
    transform: scale(1) translateY(0);
    transition: left 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94),
                top 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94);
}

@keyframes loadingJump {
    0% {
        transform: translateY(0) scale(1);
    }
    50% {
        transform: translateY(-40px) scale(1.1);
    }
    100% {
        transform: translateY(0) scale(1);
    }
}

/* Generating: Disperse with per-circle audio-reactive vertical pull */
.mic-area.state-generating .viz-item {
    transform: translateY(var(--offset, 0px)) scale(1);
    transition: transform 0.08s linear;
}
    </style>
</head>

<body class="bg-idle">
    <div class="container">
        <h1>🎙️ دستیار صوتی هوش مصنوعی</h1>
        <p class="subtitle">با من صحبت کنید، من پاسخ می‌دهم</p>

        <!-- Settings Toggle -->
        <div class="settings-toggle">
            <button class="settings-btn" id="settingsBtn">
                ⚙️ تنظیمات
            </button>
            <button class="mic-button" id="micBtn" title="شروع ضبط"></button>
        </div>

        <!-- Main Content -->
        <div class="main-content" id="mainContent">
            <!-- Microphone Area -->
            <div class="mic-area state-idle" id="micArea">
                <div class="status-animation" id="statusAnimation">
                    <div class="viz-item" style="--i: 0"></div>
                    <div class="viz-item" style="--i: 1"></div>
                    <div class="viz-item" style="--i: 2"></div>
                    <div class="viz-item" style="--i: 3"></div>
                    <div class="viz-item" style="--i: 4"></div>
                </div>
                <div class="status-text" id="statusText">آماده برای گفتگو</div>
            </div>

            <!-- Action Buttons -->
            <div class="action-buttons">
                <button class="btn btn-file" id="sendFileBtn">
                    📁 انتخاب فایل صوتی
                </button>
                <button class="btn btn-reset" id="resetButton">
                    🔄 شروع مجدد
                </button>
            </div>
            <input type="file" id="audioFile" accept="audio/*">

            <!-- Transcript Area -->
            <div class="transcript-area" id="transcriptArea">
                <div class="empty-state">هنوز پیامی ارسال نشده است</div>
            </div>
            <button class="replay-button" id="replayButton" style="display: none;">
                🔁 پخش مجدد همه
            </button>
        </div>

        <!-- Settings Panel -->
        <div class="settings-panel hidden" id="settingsPanel">
            <h2 style="color: #2d3748; margin-bottom: 20px; text-align: center;">⚙️ تنظیمات</h2>
            <div class="STT">
                <h4>STT</h4>
                <div class="setting-group">
                    <label for="languageSelect">زبان تشخیص:</label>
                    <select id="languageSelect">
                        <option value="default" selected>خودکار</option>
                        <option value="fa">فارسی</option>
                        <option value="en">English</option>
                    </select>
                </div>
                <div class="setting-group">
                    <label for="modelSelectSTT">مدل پردازش:</label>
                    <select id="modelSelectSTT">
                        <option value="tiny">سریع (Tiny)</option>
                        <option value="small">کوچک (Small)</option>
                        <option value="medium" selected>متوسط (Medium)</option>
                        <option value="base">پایه (Base)</option>
                        <option value="large">بزرگ (Large)</option>
                    </select>
                </div>
            </div>  

            <div class="LLM">
                <h4>LLM</h4>
                <div class="setting-group">
                    <label for="modelSelectLLM">مدل پردازش:</label>
                    <select id="modelSelectLLM">
                        <option value="openai/gpt-5-nano">gpt-5-nano</option>
                        <option value="openai/gpt-4o-mini">gpt-4o-mini</option>
                        <option value="openai/gpt-3.5-turbo" selected>gpt-3.5-turbo</option>
                        <option value="anthropic/claude-3.5-sonnet">claude-3.5-sonnet</option>
                        <option value="google/gemini-2.5-flash-lite">gemini-2.5-flash-lite</option>
                        <option value="google/gemini-2.5-flash">gemini-2.5-flash</option>
                        <option value=""></option>
                        <option value=""></option>
                        <option value=""></option>
                        <option value=""></option>
                        <option value=""></option>
                        <option value=""></option>
                        <option value=""></option>
                        <option value=""></option>
                        <option value=""></option>
                        <option value=""></option>
                        <option value=""></option>
                        <option value=""></option>
                    </select>
                </div>
                    <div class="setting-group">
                    <label for="toneSelectSTT">لحن پاسخ:</label>
                    <select id="toneSelectSTT">
                        <option value="official">رسمی</option>
                        <option value="friendly" selected>دوستانه</option>
                        <option value="professional">حرفه ای </option>
                        <option value="Humorous">طنزآمیز</option>
                        <option value="Decisive">قاطع</option>
                    </select>
                </div>
            </div>
            
            <div class="TTS"> 
                <h4>TTS</h4>
                <div class="setting-group">
                    <label for="modelSelectTTS">مدل پردازش:</label>
                    <select id="modelSelectTTS">
                        <option value="elevenlabs/v3_alpha" selected>elevenlabs/v3_alpha</option>
                        <option value="minimax/speech-2.6-hd">minimax/speech-2.6-hd</option>
                        <option value="openai/tts-1-hd">openai/tts-1-hd</option>
                        <option value=""></option>
                        <option value=""></option>
                        <option value=""></option>
                        <option value=""></option>
                        <option value=""></option>
                        <option value=""></option>
                        <option value=""></option>
                        <option value=""></option>
                    </select>
                </div>
                <div class="setting-group">
                    <label for="nameVoiceSelectTTS">صدای گوینده:</label>
                    <select id="nameVoiceSelectTTS">
                        <option value="Alice">Alice</option>
                        <option value="bb" selected>bb</option>
                        <option value="cc">cc</option>
    
                    </select>
                </div>
            </div>

            <button class="settings-close" id="settingsClose">
                ✓ ذخیره و بازگشت
            </button>
        </div>
    </div>
    <script src="../static/js/script.js"></script>
</body>

</html>
